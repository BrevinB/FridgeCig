<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: linear-gradient(165deg, #E3172B 0%, #B80F1F 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 44px;
    padding: 0 96px;
  }
  .eyebrow {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.85;
  }
  h1 {
    font-size: {{TITLE_SIZE}}px;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.01em;
  }
  .sub {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.35;
    opacity: 0.92;
    max-width: 820px;
  }
  footer {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 44px 96px;
    font-size: 30px;
    font-weight: 700;
  }
  footer .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; opacity: 0.9;
  }
</style>
</head>
<body>
  <main>
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUBTITLE}}</div>
  </main>
  <footer><span class="dot"></span>{{FOOTER}}</footer>
</body>
</html>
