<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: #F5F5F7;
    color: #1C1C1E;
    display: flex;
    flex-direction: column;
    padding: 90px 84px;
  }
  .eyebrow {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #E3172B;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 76px;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin-bottom: 64px;
  }
  ul { list-style: none; flex: 1; display: flex; flex-direction: column; gap: 34px; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 30px;
    background: #fff;
    border-radius: 28px;
    padding: 34px 38px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  }
  .num {
    flex: none;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(165deg, #E3172B, #B80F1F);
    color: #fff;
    font-size: 32px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  li b { display: block; font-size: 40px; font-weight: 800; margin-bottom: 6px; }
  li p { font-size: 30px; line-height: 1.35; color: #6E6E73; }
  footer {
    margin-top: 56px;
    font-size: 28px;
    font-weight: 700;
    color: #E3172B;
  }
</style>
</head>
<body>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1>{{TITLE}}</h1>
  <ul>
    {{ITEMS}}
  </ul>
  <footer>{{FOOTER}}</footer>
</body>
</html>
