<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: linear-gradient(165deg, #E3172B 0%, #B80F1F 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 52px;
    padding: 96px;
  }
  .card {
    background: #fff;
    border-radius: 48px;
    padding: 100px 90px;
    width: 100%;
    text-align: center;
    box-shadow: 0 40px 90px rgba(0,0,0,0.28);
  }
  .label {
    display: inline-block;
    background: #E3172B;
    color: #fff;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 16px 36px;
    border-radius: 999px;
    margin-bottom: 48px;
  }
  .stat {
    font-size: 240px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.03em;
    color: #1C1C1E;
  }
  .unit {
    font-size: 46px;
    font-weight: 700;
    color: #6E6E73;
    margin-top: 28px;
  }
  .caption {
    color: #fff;
    font-size: 44px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
    max-width: 840px;
  }
  .footer {
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="label">{{LABEL}}</div>
    <div class="stat">{{STAT}}</div>
    <div class="unit">{{UNIT}}</div>
  </div>
  <div class="caption">{{CAPTION}}</div>
  <div class="footer">{{FOOTER}}</div>
</body>
</html>
